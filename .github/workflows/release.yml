name: Build desktop installers

on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set app version from release tag
        run: node scripts/set-version-from-tag.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies
        run: npm ci
      - name: Install playback service dependencies
        working-directory: service-runtime
        run: npm ci
      - name: Install icon generator
        run: python -m pip install Pillow
      - name: Prepare service and icons
        run: |
          npm run assets
          node scripts/prepare-service.mjs ./vendor/sinton-service
      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Build macOS installer
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sinton ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: false
          files: installers/*
